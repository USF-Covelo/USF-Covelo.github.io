<!DOCTYPE html>
<html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Criar Conta · USF Covelo</title><link rel="icon" href="favicon.png"><link rel="stylesheet" href="style.css"></head><body data-pagina="registar">
<div id="cabecalho"></div>
<div class="page-title"><div class="wrap"><h1>Criar Conta</h1></div></div>
<main class="wrap"><section>
  <div class="card form-card largo">
    <h2>Registo de utente</h2>
    <p class="sub">Os campos marcados com * são obrigatórios.</p>

    <button type="button" id="btn-cmd" class="btn-cmd">Registar com Chave Móvel Digital</button>
    <div id="msg-cmd" class="msg" hidden></div>
    <div class="separador"><span>ou preencha os dados</span></div>

    <form id="form-registar" class="form" novalidate>
      <fieldset><legend>Identificação</legend>
        <label>Nome completo *
          <input name="nomeCompleto" autocomplete="name" required></label>
        <div class="duas">
          <label>N.º de utente (SNS) *
            <input name="numeroUtente" inputmode="numeric" maxlength="9" placeholder="9 dígitos" required></label>
          <label>NIF <small>(opcional)</small>
            <input name="nif" inputmode="numeric" maxlength="9" placeholder="9 dígitos"></label>
        </div>
      </fieldset>

      <fieldset><legend>Contactos e morada</legend>
        <div class="duas">
          <label>E-mail *
            <input name="email" type="email" autocomplete="email" required></label>
          <label>Telemóvel *
            <input name="telemovel" type="tel" autocomplete="tel" placeholder="9xx xxx xxx" required></label>
        </div>
        <label>Morada atualizada *
          <input name="morada" autocomplete="street-address" placeholder="Rua, número, andar" required></label>
        <div class="duas">
          <label>Código postal *
            <input name="codigoPostal" autocomplete="postal-code" placeholder="0000-000" maxlength="8" required></label>
          <label>Localidade *
            <input name="localidade" autocomplete="address-level2" required></label>
        </div>
      </fieldset>

      <fieldset><legend>Palavra-passe</legend>
        <div class="duas">
          <label>Palavra-passe *
            <input name="password" type="password" autocomplete="new-password" minlength="8" required>
            <small>Mínimo 8 caracteres.</small></label>
          <label>Confirmar palavra-passe *
            <input name="password2" type="password" autocomplete="new-password" required></label>
        </div>
      </fieldset>

      <label class="check"><input type="checkbox" name="consentimento">
        <span>Autorizo a USF Covelo a guardar e tratar os dados acima para efeitos de identificação e contacto, nos termos do RGPD. Posso pedir a alteração ou eliminação dos meus dados a qualquer momento.</span></label>

      <div id="msg-registar" class="msg" hidden role="alert"></div>
      <button type="submit" class="btn-p">Criar conta</button>
    </form>
    <p class="links">Já tem conta? <a href="entrar.html">Entrar</a></p>
  </div>
</section></main>
<div id="rodape"></div>
<script src="site.js"></script></body></html>
